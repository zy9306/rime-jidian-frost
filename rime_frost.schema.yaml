# Rime schema settings
# encoding: utf-8

schema:
  schema_id: rime_frost
  name: "白霜拼音"
  version: "2026-04-25"
  author:
    - gaboolic
  description: |
    白霜拼音纯拼音方案。

switches:
  - name: ascii_mode
    reset: 0
    states: [中, En]
  - name: zh_trad
    reset: 0
    states: [简体, 繁体]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [。，, ．，]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@tradition

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/in$/ing/
    - derive/ing$/in/
    - derive/en$/eng/
    - derive/eng$/en/
    - derive/on$/ong/
    - derive/ong$/on/
    - derive/^r/l/
    - derive/^l/r/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])v/$1u/

translator:
  dictionary: rime_frost
  enable_completion: true
  enable_sentence: true
  enable_user_dict: true
  initial_quality: 1
  preedit_format:
    - xform/([nl])v/$1v/
    - xform/([nl])ue/$1ve/

tradition:
  opencc_config: s2hk.json
  option_name: zh_trad

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
